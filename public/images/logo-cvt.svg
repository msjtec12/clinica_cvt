<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <!-- Logotipo Oficial CVT - Clínica Veterinária Thieres com Silhuetas de Cão e Gato -->
  <defs>
    <style>
      .cvt-green { fill: #0f5934; }
      .cvt-stroke { stroke: #0f5934; stroke-width: 8; fill: none; }
      .cvt-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Silhueta do Cachorro (lado esquerdo) -->
  <g class="cvt-green" transform="translate(10, 20) scale(1.15)">
    <path d="M 12 100 C 12 75 16 55 28 35 C 32 28 38 12 40 4 C 42 2 45 4 47 10 C 50 18 53 28 55 35 C 62 42 72 45 82 48 C 92 50 102 54 98 62 C 95 68 85 68 76 72 C 68 76 60 84 56 94 C 54 98 52 104 50 110 L 12 110 Z"/>
  </g>

  <!-- Silhueta do Gato (lado direito) -->
  <g class="cvt-green" transform="translate(425, 22) scale(1.15)">
    <path d="M 80 108 L 40 108 C 38 100 36 92 34 84 C 30 72 22 66 14 62 C 10 60 4 58 6 52 C 8 46 16 46 22 42 C 28 38 32 30 30 20 C 29 14 28 8 32 4 C 36 8 42 18 45 25 C 52 28 62 26 70 20 C 72 18 76 10 78 4 C 82 8 82 16 82 24 C 84 45 88 75 88 108 Z"/>
  </g>

  <!-- Elipse / Anel inclinado ao redor da sigla CVT -->
  <ellipse cx="270" cy="72" rx="105" ry="46" class="cvt-stroke" transform="rotate(-7 270 72)" />

  <!-- Sigla CVT Central em Negrito com efeito de recorte no anel -->
  <text x="270" y="92" text-anchor="middle" class="cvt-green cvt-text" font-size="78" letter-spacing="-2">CVT</text>

  <!-- Subtítulo: Clínica Veterinária Thieres -->
  <text x="270" y="148" text-anchor="middle" class="cvt-green cvt-text" font-size="28" letter-spacing="0.5">Clínica Veterinária Thieres</text>

  <!-- Linha de Serviços: CONSULTAS • CIRURGIAS • EXAMES • VACINAS -->
  <text x="270" y="172" text-anchor="middle" fill="#136039" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="3">
    CONSULTAS • CIRURGIAS • EXAMES • VACINAS
  </text>
</svg>
